<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐시 클리어 - 다공</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-16">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-2xl font-bold text-center mb-6">🔄 캐시 클리어</h1>
            
            <div id="status" class="mb-6 text-center">
                <p class="text-gray-600">캐시를 클리어하고 있습니다...</p>
            </div>
            
            <div class="space-y-4">
                <button onclick="clearCache()" class="w-full bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600">
                    캐시 강제 클리어
                </button>
                
                <button onclick="goHome()" class="w-full bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600">
                    홈으로 이동
                </button>
            </div>
            
            <div class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded">
                <h3 class="font-bold mb-2">수동으로 캐시 클리어하는 방법:</h3>
                <ol class="text-sm space-y-1 list-decimal list-inside">
                    <li><strong>Chrome/Edge:</strong> Ctrl+Shift+Delete → 캐시 삭제</li>
                    <li><strong>Firefox:</strong> Ctrl+Shift+Delete → 캐시 삭제</li>
                    <li><strong>Safari:</strong> Cmd+Option+E → 캐시 비우기</li>
                    <li><strong>모바일:</strong> 브라우저 설정 → 인터넷 사용 기록 삭제</li>
                </ol>
            </div>
        </div>
    </div>
    
    <script>
        // 즉시 캐시 클리어 시도
        window.onload = function() {
            clearCache();
        };
        
        function clearCache() {
            const statusEl = document.getElementById('status');
            
            try {
                // LocalStorage 클리어
                localStorage.clear();
                
                // SessionStorage 클리어
                sessionStorage.clear();
                
                // Service Worker 제거
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                
                // Cache Storage 클리어
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        for (let name of names) {
                            caches.delete(name);
                        }
                    });
                }
                
                statusEl.innerHTML = `
                    <div class="text-green-600">
                        <i class="fas fa-check-circle text-4xl mb-3"></i>
                        <p class="font-bold">✅ 캐시가 클리어되었습니다!</p>
                        <p class="text-sm mt-2">이제 새로고침(F5) 또는 Ctrl+F5를 눌러주세요.</p>
                    </div>
                `;
                
                // 3초 후 자동 새로고침
                setTimeout(function() {
                    window.location.href = '/?nocache=' + Date.now();
                }, 3000);
                
            } catch (error) {
                statusEl.innerHTML = `
                    <div class="text-red-600">
                        <p class="font-bold">❌ 오류 발생</p>
                        <p class="text-sm mt-2">수동으로 캐시를 클리어해주세요.</p>
                        <p class="text-xs mt-2">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function goHome() {
            window.location.href = '/?nocache=' + Date.now();
        }
    </script>
</body>
</html>
