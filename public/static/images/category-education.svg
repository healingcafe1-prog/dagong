<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 배경 그라데이션 -->
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 -->
  <rect width="200" height="200" fill="url(#eduGrad)"/>
  
  <!-- 책 -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="80" height="60" fill="#ecf0f1" rx="4"/>
    <rect x="38" y="0" width="4" height="60" fill="#bdc3c7"/>
    <line x1="10" y1="15" x2="30" y2="15" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="10" y1="25" x2="30" y2="25" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="10" y1="35" x2="30" y2="35" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="50" y1="15" x2="70" y2="15" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="50" y1="25" x2="70" y2="25" stroke="#7f8c8d" stroke-width="2"/>
  </g>
  
  <!-- 찻잔 -->
  <g transform="translate(110, 100)">
    <ellipse cx="25" cy="10" rx="18" ry="8" fill="#3498db" opacity="0.3"/>
    <path d="M 7,10 Q 7,35 25,35 Q 43,35 43,10" fill="none" stroke="#ecf0f1" stroke-width="3"/>
    <ellipse cx="25" cy="10" rx="18" ry="6" fill="#ecf0f1"/>
    <!-- 손잡이 -->
    <path d="M 43,15 Q 55,20 55,28 Q 55,36 43,30" fill="none" stroke="#ecf0f1" stroke-width="3"/>
  </g>
  
  <!-- 학사모 -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="40" height="4" fill="#e74c3c"/>
    <polygon points="20,0 0,15 40,15" fill="#c0392b"/>
    <rect x="18" y="-8" width="4" height="8" fill="#e74c3c"/>
    <circle cx="20" cy="-8" r="3" fill="#f39c12"/>
  </g>
</svg>
