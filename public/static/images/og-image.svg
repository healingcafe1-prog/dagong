<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그라디언트 -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c9473;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a6f52;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- 반투명 패턴 -->
  <circle cx="100" cy="100" r="150" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="500" r="200" fill="#ffffff" opacity="0.1"/>
  
  <!-- 메인 텍스트 -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">
    다공 (茶工)
  </text>
  
  <!-- 서브 텍스트 -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" opacity="0.9">
    전통 차와 공예의 품격
  </text>
  
  <!-- 설명 텍스트 -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" opacity="0.8">
    생산자와 직접 거래하는 프리미엄 플랫폼
  </text>
  
  <!-- 아이콘들 -->
  <text x="400" y="520" font-size="50">🍵</text>
  <text x="550" y="520" font-size="50">🎨</text>
  <text x="700" y="520" font-size="50">🎁</text>
  
  <!-- URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.7">
    dagong.co.kr
  </text>
</svg>
