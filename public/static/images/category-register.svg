<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 배경 그라데이션 -->
  <defs>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 -->
  <rect width="200" height="200" fill="url(#regGrad)"/>
  
  <!-- 문서/상품카드 -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="100" height="120" fill="#ecf0f1" rx="8"/>
    
    <!-- 이미지 영역 -->
    <rect x="10" y="10" width="80" height="60" fill="#bdc3c7" rx="4"/>
    <circle cx="30" cy="35" r="8" fill="#f39c12"/>
    <polygon points="50,50 70,35 90,55 90,65 50,65" fill="#95a5a6"/>
    
    <!-- 텍스트 라인 -->
    <rect x="10" y="80" width="60" height="4" fill="#7f8c8d" rx="2"/>
    <rect x="10" y="90" width="80" height="4" fill="#7f8c8d" rx="2"/>
    <rect x="10" y="100" width="50" height="4" fill="#7f8c8d" rx="2"/>
  </g>
  
  <!-- 플러스 아이콘 -->
  <g transform="translate(130, 120)">
    <circle cx="0" cy="0" r="25" fill="#2ecc71"/>
    <rect x="-12" y="-3" width="24" height="6" fill="white" rx="2"/>
    <rect x="-3" y="-12" width="6" height="24" fill="white" rx="2"/>
  </g>
</svg>
