name: 자동 배포 (Cloudflare Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: 🚀 Cloudflare Pages 자동 배포
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🔧 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 의존성 설치
        run: npm ci

      - name: 🏗️ 빌드
        run: npm run build

      - name: 🚀 Cloudflare Pages 배포
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dagong
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗄️ 데이터베이스 마이그레이션
        if: success()
        run: |
          echo "📊 DB 마이그레이션 확인 중..."
          if [ -d "migrations" ]; then
            echo "✅ 마이그레이션 파일 발견"
            echo "ℹ️ 마이그레이션은 Cloudflare Dashboard에서 수동으로 실행해주세요"
            echo "   npx wrangler d1 migrations apply webapp-production --remote"
          else
            echo "ℹ️ 적용할 마이그레이션 없음"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: ✅ 배포 완료 알림
        if: success()
        run: |
          echo "🎉 배포가 성공적으로 완료되었습니다!"
          echo "🌐 사이트: https://dagong.co.kr"
          echo "📅 배포 시간: $(date)"
