name: Auto Deploy to Cloudflare Pages

on:
  # 매일 새벽 5시 (한국 시간 기준 UTC+9) = UTC 20시 전날
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 = KST 05:00 다음날
  
  # 수동 실행 가능
  workflow_dispatch:
  
  # main 브랜치에 푸시될 때도 실행
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 가져오기
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
        
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dagong
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create deployment tag
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          TAG_NAME="auto-deploy-$(date +'%Y%m%d-%H%M%S')"
          git tag -a "$TAG_NAME" -m "🤖 Auto deployment on $(date +'%Y-%m-%d %H:%M:%S KST')"
          git push origin "$TAG_NAME" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 배포 성공: $(date +'%Y-%m-%d %H:%M:%S KST')"
          else
            echo "❌ 배포 실패: $(date +'%Y-%m-%d %H:%M:%S KST')"
          fi
